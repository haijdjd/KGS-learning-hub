
<div id="video-player" style="display:none;background:#101f35;padding:15px;border-radius:14px;margin:15px 0">
  <h3 id="playing-title">Lecture Video</h3>
  <div style="position:relative;width:100%;aspect-ratio:16/9;margin-top:10px">
    <iframe id="lecture-frame" title="Lecture video player"
      style="position:absolute;width:100%;height:100%;inset:0;border:0;border-radius:10px"
      allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share"
      allowfullscreen></iframe>
  </div>
  <button type="button" onclick="closeLecture()"
    style="padding:10px;margin-top:12px;border-radius:8px">
    ✕ वीडियो बंद करें
  </button>
</div>

<script>
function getEmbedUrl(rawUrl){
  try{
    const u = new URL(rawUrl);
    if(!["https:","http:"].includes(u.protocol)) return "";
    const host = u.hostname.toLowerCase();
    let id = "";

    if(host === "youtu.be"){
      id = u.pathname.split("/").filter(Boolean)[0] || "";
    }else if(host.endsWith("youtube.com")){
      if(u.pathname === "/watch") id = u.searchParams.get("v") || "";
      else {
        const parts = u.pathname.split("/").filter(Boolean);
        if(["live","embed","shorts"].includes(parts[0])) id = parts[1] || "";
      }
    }

    if(id && /^[a-zA-Z0-9_-]{11}$/.test(id)){
      return "https://www.youtube-nocookie.com/embed/" + id;
    }

    // Direct video files can be played through a native video element.
    if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(u.pathname + u.search)){
      return u.href;
    }
    return "";
  }catch(e){
    return "";
  }
}

function playLecture(title, url){
  const safeUrl = getEmbedUrl(url);
  if(!safeUrl){
    alert("यह वीडियो लिंक समर्थित नहीं है। अधिकृत YouTube या direct MP4 लिंक जोड़ें।");
    return;
  }

  const player = document.getElementById("video-player");
  const frame = document.getElementById("lecture-frame");
  document.getElementById("playing-title").textContent = title;

  if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(new URL(safeUrl).pathname)){
    frame.src = "";
    let video = document.getElementById("direct-video");
    if(!video){
      video = document.createElement("video");
      video.id = "direct-video";
      video.controls = true;
      video.playsInline = true;
      video.style.cssText = "width:100%;margin-top:10px;border-radius:10px";
      frame.parentElement.after(video);
    }
    video.src = safeUrl;
    video.style.display = "block";
    frame.style.display = "none";
  }else{
    const video = document.getElementById("direct-video");
    if(video){video.pause();video.removeAttribute("src");video.load();video.style.display="none";}
    frame.style.display = "block";
    frame.src = safeUrl;
  }

  player.style.display = "block";
  player.scrollIntoView({behavior:"smooth",block:"start"});
}

function closeLecture(){
  const frame = document.getElementById("lecture-frame");
  frame.src = "";
  const video = document.getElementById("direct-video");
  if(video){video.pause();video.removeAttribute("src");video.load();}
  document.getElementById("video-player").style.display = "none";
}
</script>
